<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Painel | SupportFlow</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="pagina-sistema">

<header class="cabecalho-sistema">
    <a class="marca marca-painel" href="/painel.html">
        <span class="marca-icone">SF</span>
        <span>SupportFlow</span>
    </a>

    <div class="usuario-cabecalho">
        <div>
            <strong id="nome-cabecalho">
                Carregando...
            </strong>

            <span id="perfil-cabecalho"></span>
        </div>

        <button
                id="botao-logout"
                class="botao-sair"
                type="button"
        >
            Sair
        </button>
    </div>
</header>

<div class="layout-sistema">

    <aside class="menu-lateral">
        <nav>
            <a
                    class="menu-item ativo"
                    href="/painel.html"
            >
                Início
            </a>

            <a
                    class="menu-item"
                    href="/chamados.html"
                    id="link-chamados"
            >
                Meus chamados
            </a>

            <a
                    class="menu-item"
                    href="/novo-chamado.html"
                    id="link-novo-chamado"
            >
                Abrir chamado
            </a>

            <a
                    class="menu-item oculto"
                    href="#"
                    id="link-administracao"
            >
                Administração
            </a>
        </nav>
    </aside>

    <main class="conteudo-sistema">

        <section class="titulo-pagina">
            <div>
                    <span class="etiqueta-pagina">
                        Visão geral
                    </span>

                <h1 id="titulo-boas-vindas">
                    Carregando seu painel...
                </h1>

                <p>
                    Acompanhe seus atendimentos pelo SupportFlow.
                </p>
            </div>
        </section>

        <section
                id="mensagem-painel"
                class="mensagem-pagina"
                aria-live="polite"
        ></section>

        <section class="grade-resumo">

            <article class="cartao-resumo">
                    <span class="cartao-rotulo">
                        Conta
                    </span>

                <strong id="nome-usuario">
                    —
                </strong>

                <small id="email-usuario">
                    —
                </small>
            </article>

            <article class="cartao-resumo">
                    <span class="cartao-rotulo">
                        Perfil
                    </span>

                <strong id="papel-usuario">
                    —
                </strong>

                <small>
                    Permissões da conta
                </small>
            </article>

            <article class="cartao-resumo">
                    <span class="cartao-rotulo">
                        Sessão
                    </span>

                <strong class="texto-sucesso">
                    Ativa
                </strong>

                <small>
                    Autenticado com JWT
                </small>
            </article>

        </section>

        <section class="cartao-conteudo">
            <h2>Primeiros passos</h2>

            <p id="orientacao-usuario">
                Carregando suas informações...
            </p>
        </section>

    </main>
</div>

<script src="/js/auth.js"></script>
<script src="/js/painel.js"></script>
</body>
</html>
